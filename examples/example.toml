# shellsync: one config for zsh, nushell and PowerShell.
#
# Edit with `shellsync edit`. Changes apply to every new zsh, nu and pwsh session.
#
# In [env] values and [path] entries:
#   ~/...           your home directory
#   $NAME, ${NAME}  another environment variable (resolved at shell startup)
#   $$              a literal $
#
# Any value can be split per shell:  KEY = { zsh = "...", nu = "...", pwsh = "..." }
# Leave a shell out to skip it there. `sh` stands for every shell with POSIX
# sh syntax (currently zsh); a shell's own key takes precedence over it.

[env]
EDITOR = "vim"
# GOPATH = "~/go"
# LESS = "-R"

[path]
# Directories to add in front of / after the existing PATH (duplicates removed).
prepend = ["~/.local/bin"]
# append = ["$GOPATH/bin"]

[aliases]
# Alias bodies are shell code, used as-is. Commands that behave the same in
# every shell can share one line; split the rest. (In PowerShell, an alias
# becomes a function that passes its arguments on.)
g = "git"
gs = "git status"
# ll = { sh = "ls -lh", nu = "ls -l" }

# Entries under [tool.X] apply only where X is installed, checked at every
# shell start. See the README for `command` and `exists`.
# [tool.eza.aliases]
# ls = "eza --long --header"

[zsh]
# Raw zsh code, appended to the generated file.
init = '''
'''

[nu]
# Raw nushell code, appended to the generated file.
init = '''
'''

[pwsh]
# Raw PowerShell code, appended to the generated file.
init = '''
'''

# shellsync: one config for zsh and nushell.
#
# Edit with `shellsync edit`. Changes apply to every new zsh / nu session.
#
# In [env] values and [path] entries:
#   ~/...           your home directory
#   $NAME, ${NAME}  another environment variable (resolved at shell startup)
#   $$              a literal $
#
# Any value can be split per shell:  KEY = { zsh = "...", nu = "..." }
# Leave a side out to skip it in that shell.

[env]
EDITOR = "vim"
# GOPATH = "~/go"
# LESS = "-R"

[path]
# Directories to add in front of / after the existing PATH (duplicates removed).
prepend = ["~/.local/bin"]
# append = ["$GOPATH/bin"]

[aliases]
# Alias bodies are shell code, used as-is. Commands that behave the same in
# both shells can share one line; split the rest.
g = "git"
gs = "git status"
# ll = { zsh = "ls -lh", nu = "ls -l" }

[zsh]
# Raw zsh code, appended to the generated file.
init = '''
'''

[nu]
# Raw nushell code, appended to the generated file.
init = '''
'''
